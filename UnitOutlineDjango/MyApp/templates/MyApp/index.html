{% load static %}
<html>

<head>
    <title>Teachers</title>
</head>

<body>
    <style>
        .navbar {
            border-top: solid;
            border-bottom: solid;
            list-style-type: none;
            margin: 0;
            padding: 0;

        }
        .navbarlist {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f3f5;
         
        }

        .navbarlist li {
            float: left;
        }

        .navbarlist li a {
            display: block;
            color: black;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        .navbarlist li a:hover {
            background-color: #cbcfd1;

        }
    </style>
    <div class="navbar">
        <a class="navbar-brand" href="#"><img src="{% static 'images/ACTGov2.png' %}" alt='ACT GOV LOGO'/></a>
        <ul class="navbarlist">
            <!-- Change ts to some real links-->

            <li><a href="#Home">Home</a></li>
            <li><a href="#Unit_Outline">Unit Outline</a></li>
            <li><a href="#Results">Results</a></li>
            <li><a href="#Academic_Record">Academic Record</a></li>
        </ul>
    </div>
    <strong>Teachers</strong>

    {% if content %}
    <table>
        <tr>
            <th>Name</th>
            <th>Teaching Area</th>
        </tr>
        {% for teach in content %}
        <tr>
            <td>{{ teach.Name }}</td>
            <td>{{ teach.Area }}</td>
        </tr>
        {% endfor %}
    </table>
    {% else %}
    <strong>No data!!</strong>
    {% endif %}
    <a href="{% url 'input' %}">Add New Teacher</a>
    <a href="{% url 'course' %}">View Courses</a>

    <p><a href="{% url 'report' %}">Download PDF</a></p>

</body>
</html>
